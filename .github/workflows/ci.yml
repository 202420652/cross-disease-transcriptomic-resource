name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: pip install -e ".[test]"
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Check reference-table consistency
        run: python scripts/validate_reference_tables.py data/reference
